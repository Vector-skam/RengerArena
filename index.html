<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RengerArena</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050805; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; color: #0f0; pointer-events: none; z-index: 10; }
        .joystick-container { position: absolute; bottom: 40px; width: 110px; height: 110px; background: rgba(0, 255, 0, 0.05); border: 1px solid rgba(0, 255, 0, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        #move-container { left: 30px; }
        #shoot-container { right: 30px; border-color: rgba(255, 50, 50, 0.3); }
        .stick { width: 45px; height: 45px; background: rgba(0, 255, 0, 0.3); border-radius: 50%; pointer-events: none; }
        #shoot-stick { background: rgba(255, 50, 50, 0.3); }
        #dash-btn { position: absolute; bottom: 170px; right: 45px; width: 65px; height: 65px; background: rgba(0, 255, 0, 0.1); border: 2px solid #0f0; border-radius: 50%; color: #0f0; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; user-select: none; }
    </style>
</head>
<body>

<div id="ui">
    <div style="font-size: 18px;">SCORE: <span id="score">0</span></div>
    <div id="wp-text" style="color: #0ff;">GUN: PISTOL</div>
    <div id="wp-timer" style="color: #ff0;"></div>
    <div style="font-size: 10px; margin-top: 5px; opacity: 0.7;">НАЖМИ НА ЭКРАН ДЛЯ ВКЛ. ЗВУКА</div>
</div>

<div id="move-container" class="joystick-container"><div id="move-stick" class="stick"></div></div>
<div id="shoot-container" class="joystick-container"><div id="shoot-stick" class="stick"></div></div>
<div id="dash-btn">DASH</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- AUDIO ENGINE (Синтезатор звуков) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(); osc.stop(now + 0.1);
    } else if (type === 'uzi') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(); osc.stop(now + 0.05);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(); osc.stop(now + 0.2);
    } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(); osc.stop(now + 0.2);
    } else if (type === 'dash') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(1000, now + 0.3);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(); osc.stop(now + 0.3);
    }
}

// --- GAME SETTINGS ---
let score = 0;
const WEAPONS = {
    PISTOL: { name: "PISTOL", fireRate: 400, color: "#fff", spread: 0.05, count: 1, bSize: 3, speed: 12, sound: 'shoot' },
    UZI: { name: "UZI", fireRate: 110, color: "#0ff", spread: 0.15, count: 1, bSize: 2, speed: 15, sound: 'uzi' },
    SHOTGUN: { name: "SHOTGUN", fireRate: 800, color: "#f90", spread: 0.5, count: 6, bSize: 3, speed: 9, sound: 'shoot' },
    MG: { name: "MINIGUN", fireRate: 80, color: "#ff0", spread: 0.04, count: 1, bSize: 3, speed: 16, sound: 'uzi' }
};

const player = {
    x: 0, y: 0, radius: 11, angle: 0, speed: 4.5,
    weapon: WEAPONS.PISTOL, wpTimer: 0, lastShot: 0,
    isDashing: false, dashTime: 0, dashCooldown: 0
};

let enemies = [], bullets = [], powerups = [];
const controls = { move: { x: 0, y: 0, tId: null }, shoot: { x: 0, y: 0, active: false, tId: null } };

// --- MULTITOUCH & CONTROLS ---
function setupControls() {
    const mZone = document.getElementById('move-container'), sZone = document.getElementById('shoot-container'), dBtn = document.getElementById('dash-btn');

    const handleStart = (e) => {
        for (let t of e.changedTouches) {
            if (isInside(t, mZone) && controls.move.tId === null) { controls.move.tId = t.identifier; updateJoy(t, mZone, 'move'); }
            else if (isInside(t, sZone) && controls.shoot.tId === null) { controls.shoot.tId = t.identifier; updateJoy(t, sZone, 'shoot'); }
            else if (isInside(t, dBtn) && player.dashCooldown <= 0) {
                player.isDashing = true; player.dashTime = 30; player.dashCooldown = 120;
                playSound('dash');
            }
        }
    };

    const handleMove = (e) => {
        for (let t of e.changedTouches) {
            if (t.identifier === controls.move.tId) updateJoy(t, mZone, 'move');
            if (t.identifier === controls.shoot.tId) updateJoy(t, sZone, 'shoot');
        }
    };

    const handleEnd = (e) => {
        for (let t of e.changedTouches) {
            if (t.identifier === controls.move.tId) { controls.move.tId = null; controls.move.x = 0; controls.move.y = 0; document.getElementById('move-stick').style.transform = `translate(0,0)`; }
            if (t.identifier === controls.shoot.tId) { controls.shoot.tId = null; controls.shoot.active = false; document.getElementById('shoot-stick').style.transform = `translate(0,0)`; }
        }
    };

    window.addEventListener('touchstart', handleStart);
    window.addEventListener('touchmove', handleMove);
    window.addEventListener('touchend', handleEnd);
}

function isInside(t, el) { let r = el.getBoundingClientRect(); return t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom; }

function updateJoy(t, zone, type) {
    let r = zone.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    let dx = t.clientX - cx, dy = t.clientY - cy, dist = Math.min(50, Math.sqrt(dx*dx + dy*dy)), ang = Math.atan2(dy, dx);
    document.getElementById(type + '-stick').style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;
    controls[type].x = dx/50; controls[type].y = dy/50;
    if (type === 'shoot') controls.shoot.active = true;
}

// --- GAME LOOP ---
function update() {
    let s = player.isDashing ? player.speed * 2.5 : player.speed;
    let nx = player.x + controls.move.x * s, ny = player.y + controls.move.y * s;
    if (nx > player.radius && nx < canvas.width - player.radius) player.x = nx;
    if (ny > player.radius && ny < canvas.height - player.radius) player.y = ny;

    if (player.isDashing && --player.dashTime <= 0) player.isDashing = false;
    if (player.dashCooldown > 0) player.dashCooldown--;

    if (controls.shoot.active) {
        let baseAng = Math.atan2(controls.shoot.y, controls.shoot.x), best = null, minD = 0.5;
        enemies.forEach(en => { let a = Math.atan2(en.y-player.y, en.x-player.x); if(Math.abs(baseAng-a)<minD){ minD=Math.abs(baseAng-a); best=a; } });
        player.angle = best !== null ? best : baseAng;

        if (Date.now() - player.lastShot > player.weapon.fireRate) {
            for(let i=0; i<player.weapon.count; i++) {
                let dev = (Math.random()-0.5) * player.weapon.spread;
                bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.angle+dev)*player.weapon.speed, vy: Math.sin(player.angle+dev)*player.weapon.speed, c: player.weapon.color, r: player.weapon.bSize });
            }
            playSound(player.weapon.sound);
            player.lastShot = Date.now();
        }
    }

    enemies.forEach((en, i) => {
        let dx = player.x-en.x, dy = player.y-en.y, d = Math.hypot(dx, dy);
        en.x += (dx/d)*2; en.y += (dy/d)*2;
        if (d < player.radius + en.radius && !player.isDashing) { score = 0; enemies = []; player.weapon = WEAPONS.PISTOL; }
        bullets.forEach((b, bi) => {
            if (Math.hypot(b.x-en.x, b.y-en.y) < en.radius + 12) {
                enemies.splice(i,1); bullets.splice(bi,1); score += 10;
                playSound('hit');
                if(Math.random() < 0.12) powerups.push({x: en.x, y: en.y, type: ["UZI","SHOTGUN","MG"][Math.floor(Math.random()*3)]});
            }
        });
    });

    bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
    bullets = bullets.filter(b => b.x > 0 && b.x < canvas.width && b.y > 0 && b.y < canvas.height);

    powerups.forEach((p, i) => {
        if (Math.hypot(player.x-p.x, player.y-p.y) < 30) {
            player.weapon = WEAPONS[p.type]; player.wpTimer = 600;
            powerups.splice(i,1); playSound('powerup');
        }
    });

    if (player.wpTimer > 0) player.wpTimer--; else player.weapon = WEAPONS.PISTOL;

    document.getElementById('score').innerText = score;
    document.getElementById('wp-text').innerText = "GUN: " + player.weapon.name;
    document.getElementById('wp-timer').innerText = player.wpTimer > 0 ? (player.wpTimer/60).toFixed(1) + "s" : "";
}

function draw() {
    ctx.fillStyle = "rgba(5, 10, 5, 0.4)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    powerups.forEach(p => { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill(); });
    
    ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
    ctx.strokeStyle = player.isDashing ? "#fff" : "#0f0"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-7,-8); ctx.lineTo(-7,8); ctx.closePath(); ctx.stroke();
    ctx.restore();

    bullets.forEach(b => { ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); });
    enemies.forEach(en => { ctx.fillStyle = "#f05"; ctx.beginPath(); ctx.arc(en.x, en.y, 11, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle="#fff"; ctx.strokeRect(en.x-3, en.y-3, 6, 6); });
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

setInterval(() => {
    if (enemies.length < 15) {
        let x, y, s = Math.floor(Math.random()*4);
        if(s==0){x=Math.random()*canvas.width; y=-30;} else if(s==1){x=Math.random()*canvas.width; y=canvas.height+30;}
        else if(s==2){x=-30; y=Math.random()*canvas.height;} else {x=canvas.width+30; y=Math.random()*canvas.height;}
        enemies.push({x, y, radius: 11});
    }
}, 800);

window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
player.x = canvas.width/2; player.y = canvas.height/2;

setupControls();
loop();
</script>
</body>

</html>
